name: Platform checks

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host and documentation (no ROS integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Optional ROS manifest evaluator
        run: python -m pip install catkin-pkg==1.0.0
      - name: Host regressions
        run: python3 -m unittest discover -s tools/tests -v
      - name: Public documentation links
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Code formatting
        run: ./setup/format.sh --check

  package:
    name: Installed client (Python ${{ matrix.python }}, no SDK/device)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Wheel build prerequisites
        run: python -m pip install pip==26.2.2 setuptools==84.2.1 wheel==0.48.0
      - name: Build tracked-source wheel
        run: python setup/build-python-package.py
      - name: Offline installed-client verification
        run: |
          python setup/verify-python-package.py dist/*.whl \
            --report dist/installed-client-report.json

  android:
    name: Android JVM tests and lint (no native SDK or device)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Android compile tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is missing}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests and Android lint
        run: ./setup/build.sh :app:testDebugUnitTest :app:lintDebug
