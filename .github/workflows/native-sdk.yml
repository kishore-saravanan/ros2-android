name: Native Android SDK build

# Deliberately separate from lightweight PR checks; no phone or release publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Jazzy ARM64 SDK, prebuilt SDK archive and C++ workspace APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ros-tooling/setup-ros@2b7b7e10fd30ff131dfb33248ddd71c5ba31dd30 # 0.7.15
        with:
          required-ros-distributions: jazzy
          use-ros2-testing: false
          install-connext: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential binutils cmake ninja-build python3-dev python3-venv \
            python3-numpy pybind11-dev  # Python SDK headers (docs/PYTHON-PROJECTS.md)
      - name: Pinned Android tools
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK root is missing}}"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' \
            'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build the bundled host-client wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/package-env"
          "$RUNNER_TEMP/package-env/bin/python" -m pip install --disable-pip-version-check 'setuptools>=68,<81' wheel
          "$RUNNER_TEMP/package-env/bin/python" setup/build-python-package.py
      - name: Installed-client journey (build tools, sources, full native SDK, external workspace APK)
        # The documented build-from-source path on a clean runner; no phone, signing secret or publishing.
        env:
          FULL_SDK: '1'
        run: tests/integration/installed_client_journey.sh dist/ros2_android-*.whl "$RUNNER_TEMP/journey"
      - name: Check workspace APK native alignment
        run: python3 setup/check-native-alignment.py --apk "$RUNNER_TEMP/journey/workspace-runner.apk"
      - name: Package the prebuilt native SDK
        run: python3 setup/package-native-sdk.py --native-root "$HOME/.cache/ros2-android-native" --out "$RUNNER_TEMP/sdk"
      - name: Journey with the prebuilt SDK in a fresh home (release-user path)
        run: |
          # Move the source-built SDK away so a missed path rewrite cannot silently use it.
          mv "$HOME/.cache/ros2-android-native" "$RUNNER_TEMP/source-built-native"
          export HOME="$RUNNER_TEMP/fresh-home" GRADLE_USER_HOME="$RUNNER_TEMP/fresh-gradle"
          mkdir -p "$HOME"
          SDK_ARCHIVE="$(ls "$RUNNER_TEMP"/sdk/ros2-android-native-sdk-*.tar.xz)" \
            tests/integration/installed_client_journey.sh dist/ros2_android-*.whl "$RUNNER_TEMP/journey-prebuilt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ros2-android-native-sdk
          path: ${{ runner.temp }}/sdk/
          retention-days: 30
          if-no-files-found: error
      - name: Record build scope
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          journey = Path(os.environ['RUNNER_TEMP']) / 'journey'
          summary = (journey / 'logs/summary.txt').read_text() if (journey / 'logs/summary.txt').is_file() else 'No journey summary.\n'
          prebuilt = Path(os.environ['RUNNER_TEMP']) / 'journey-prebuilt/logs/summary.txt'
          summary += '\nPrebuilt-SDK journey (fresh home):\n' + (prebuilt.read_text() if prebuilt.is_file() else 'not run\n')
          sums = sorted((Path(os.environ['RUNNER_TEMP']) / 'sdk').glob('*.sha256'))
          summary += '\nSDK archive: ' + (sums[0].read_text() if sums else 'not packaged\n')
          checksums = Path.home() / '.cache/ros2-android-native/native-library-checksums.json'
          if not checksums.is_file():  # moved aside for the prebuilt-SDK journey
              checksums = Path(os.environ['RUNNER_TEMP']) / 'source-built-native/native-library-checksums.json'
          hashes = json.loads(checksums.read_text()) if checksums.is_file() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('Installed-client journey steps:\n\n```\n' + summary + '```\n\n')
              report.write(f'Verified native library hashes: {len(hashes)}; workspace APK present: '
                           f"{(journey / 'workspace-runner.apk').is_file()}.\n\n")
              report.write('Build-only qualification: no phone, ROS interoperability, signing upgrade, '
                           'release publication or runtime performance test.\n')
          PY
